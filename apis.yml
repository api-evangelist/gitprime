name: Gitprime
description: >-
  GitPrime was a software engineering analytics and developer-productivity company founded in 2015
  in Durango, Colorado, backed by Y Combinator and DCVC. Its product mined data from Git repositories,
  code review, and ticketing systems to give engineering leaders visibility into team throughput,
  code churn, and delivery health. Pluralsight acquired GitPrime in 2019 (~$170M) and rebranded it as
  Pluralsight Flow; in February 2025 Appfire acquired Flow from Pluralsight, and Appfire has announced
  that Flow will be discontinued on December 31, 2027. The independent gitprime.com domain no longer
  resolves and www.gitprime.com redirects to appfire.com/flow/info, so there is no standalone GitPrime
  developer portal, public API, or specification to enrich; any surviving API functionality now lives
  under the Appfire Flow product. This profile is retained as a historical/defunct company record.
